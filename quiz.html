<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズ画像ジェネレーター2</title>
  <!-- 画像化のためのライブラリを読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.5;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }

    /* プレビュー領域 */
    .preview-wrapper {
      width: 960px;
      height: 540px;
      position: relative;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc),
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      border: 1px solid #999;
      overflow: hidden;
    }
    
    #capture-area {
      width: 1920px;
      height: 1080px;
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(0.5);
      transform-origin: top left;
    }

    /* クイズのUIデザイン */
    .quiz-container {
      position: absolute;
      bottom: 50px;
      left: 50px;
      right: 50px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .quiz-box {
      display: flex;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
      font-weight: 900;
      box-sizing: border-box;
    }
    .quiz-label {
      color: #fff;
      padding: 10px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      flex-shrink: 0; /* ラベル部分が潰れないように設定 */
    }
    .quiz-text {
      flex: 1;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #000;
      text-align: center;
      line-height: 1.2;
      /* ▼ 改行を許可し、入力欄の改行をそのまま反映させる ▼ */
      white-space: pre-wrap; 
    }

    /* 問題枠 */
    .box-q { width: 100%; border: 8px solid #000; }
    .box-q .quiz-label { background: #000; }
    .box-q .quiz-text { font-size: 45px; } /* 問題文は2行になることを想定して少し小さく */
    
    /* 選択肢枠 */
    .box-choice { width: calc(50% - 7.5px); }
    .box-a { border: 8px solid #ff0000; }
    .box-a .quiz-label { background: #ff0000; }
    
    .box-b { border: 8px solid #0000ff; }
    .box-b .quiz-label { background: #0000ff; }
    
    .box-c { border: 8px solid #00a000; }
    .box-c .quiz-label { background: #00a000; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📝 クイズ内容をペースト</h2>
    <div class="input-group">
      <label>問題と選択肢（「A.」が出てくるまでを問題文として自動認識します）</label>
      <textarea id="input-text" rows="5" oninput="updatePreview()">まうなのプロフィールに書いてある特技は、
フィンスイミング・テニス・水泳 あとひとつは？
A.ものまね B.食レポ C.逆立ち</textarea>
    </div>
    <button onclick="downloadImage()">📸 画像としてダウンロード</button>
  </div>

  <!-- プレビューと画像化の対象エリア -->
  <div class="preview-wrapper">
    <div id="capture-area">
      <div class="quiz-container">
        <!-- 問題 -->
        <div class="quiz-box box-q">
          <div class="quiz-label">問題</div>
          <div class="quiz-text" id="text-q"></div>
        </div>
        <!-- 選択肢A -->
        <div class="quiz-box box-choice box-a">
          <div class="quiz-label">A</div>
          <div class="quiz-text" id="text-a"></div>
        </div>
        <!-- 選択肢B -->
        <div class="quiz-box box-choice box-b">
          <div class="quiz-label">B</div>
          <div class="quiz-text" id="text-b"></div>
        </div>
        <!-- 選択肢C -->
        <div class="quiz-box box-choice box-c">
          <div class="quiz-label">C</div>
          <div class="quiz-text" id="text-c"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 入力内容を自動で解析してプレビューに反映
    function updatePreview() {
      const inputText = document.getElementById('input-text').value;
      const lines = inputText.split('\n');
      
      let questionLines = [];
      let choicesText = "";
      let foundChoices = false;

      // 「A.」や「A．」が含まれる行以降を選択肢として扱う処理
      for (let i = 0; i < lines.length; i++) {
        if (!foundChoices && lines[i].match(/[AＡ][.．]/)) {
          foundChoices = true;
        }
        
        if (foundChoices) {
          choicesText += lines[i] + " ";
        } else {
          questionLines.push(lines[i]);
        }
      }
      
      // 問題文をセット（配列を改行コードで結合）
      document.getElementById('text-q').textContent = questionLines.join('\n').trim();
      
      // 「A.」「B.」「C.」（半角・全角対応）を探して文字を抽出する正規表現
      const matchA = choicesText.match(/[AＡ][.．](.*?)(?=[BＢ][.．]|$)/);
      const matchB = choicesText.match(/[BＢ][.．](.*?)(?=[CＣ][.．]|$)/);
      const matchC = choicesText.match(/[CＣ][.．](.*)/);
      
      // 抽出した文字をそれぞれの枠にセット
      document.getElementById('text-a').textContent = matchA ? matchA[1].trim() : '';
      document.getElementById('text-b').textContent = matchB ? matchB[1].trim() : '';
      document.getElementById('text-c').textContent = matchC ? matchC[1].trim() : '';
    }

    // 読み込み時に一度実行して初期値を反映させる
    window.onload = updatePreview;

    // html2canvasを使って画像を生成・ダウンロード
    function downloadImage() {
      const captureArea = document.getElementById('capture-area');
      
      html2canvas(captureArea, {
        backgroundColor: null,
        scale: 1 // 1920x1080の等倍サイズで出力
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'quiz_image.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>

</body>
</html>
